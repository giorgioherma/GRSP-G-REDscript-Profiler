          '@ | Set-Content -LiteralPath (Join-Path $capture 'Data\Runtime\GRSP_ByMod.csv') -Encoding utf8

          @'
          capture_id,stable_function_id,owner,source_path,source_line,source_function,outgoing_calls,calls_per_sec,observed_inclusive_ms,exclusive_instrumented_ms,active_frames,active_frame_pct,calls_per_active_frame,max_calls_per_frame,max_call_ms,over_1ms,over_5ms,over_16_67ms
          1,RSPF-CI,"TestOwner","C:\game\r6\scripts\TestOwner\test.reds",10,"TestOwner::Tick",700,700,7,7,3,100,233,250,1,1,0,0
