name: Build GRSP 0.5.0 Public Preview

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release DLL
        run: cargo build --release

      - name: Stage game-root package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\red4ext\plugins | Out-Null
          New-Item -ItemType Directory -Force -Path package\red4ext\plugins\redscript_profiler_alpha | Out-Null
          Copy-Item target\release\redscript_profiler_alpha.dll package\red4ext\plugins\redscript_profiler_alpha.dll
          Copy-Item RSP_Scenario.txt package\red4ext\plugins\redscript_profiler_alpha\RSP_Scenario.txt
          Copy-Item README.md package\GRSP_README.txt
          Copy-Item MANIFEST.json package\GRSP_MANIFEST.json
          Copy-Item FRAMEWORK_AUTHOR_GUIDE.md package\GRSP_FRAMEWORK_AUTHOR_GUIDE.txt
          Copy-Item OUTPUT_SCHEMA.md package\GRSP_OUTPUT_SCHEMA.txt
          Copy-Item PUBLIC_RELEASE_NOTES.md package\GRSP_RELEASE_NOTES.txt
          Copy-Item THIRD_PARTY_NOTICE.txt package\GRSP_THIRD_PARTY_NOTICE.txt

      - name: Upload game-root artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRSP-0.5.0-PublicPreview-GameRoot
          path: package
