name: Publish GRSP v1.0.0 Release

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [ main ]

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish v1.0.0 release only'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified v1.0.0 portable artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download 35913361630             --repo "$GITHUB_REPOSITORY"             --name "G-REDscript-Profiler-v1.0.0"             --dir release-assets

          test -f release-assets/G-REDscript-Profiler-v1.0.0.zip
          test -f release-assets/G-REDscript-Profiler-v1.0.0.zip.sha256.txt

          echo "Downloaded release assets:"
          ls -lh release-assets

          expected="$(awk '{print $1}' release-assets/G-REDscript-Profiler-v1.0.0.zip.sha256.txt)"
          actual="$(sha256sum release-assets/G-REDscript-Profiler-v1.0.0.zip | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "Verified portable ZIP SHA256: $actual"

      - name: Create exact v1.0.0 tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="7f64d2f7b8594cbd9ec148ee49e576ee28ffd625"

          # Tag the final stable product/docs commit. Later commits only change
          # GitHub Actions release plumbing and are deliberately not part of the
          # product tag, avoiding GitHub App workflow-ref restrictions.
          # Remove a stale target tag if an earlier release attempt created one.
          git push origin :refs/tags/v1.0.0 2>/dev/null || true

          git tag -f v1.0.0 "$target"
          git push origin refs/tags/v1.0.0 --force

          remote="$(git ls-remote origin refs/tags/v1.0.0 | awk '{print $1}')"
          test "$remote" = "$target"
          echo "v1.0.0 now points to $remote"

      - name: Publish stable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # There should be no public preview release left. Remove any stale
          # release object but keep/recreate the exact tag from the previous step.
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes
          fi

          hash="$(sha256sum release-assets/G-REDscript-Profiler-v1.0.0.zip | awk '{print $1}')"
          cp PUBLIC_RELEASE_NOTES.md release-body.md
          printf '\n## SHA-256\n\n%s  %s\n'             "$hash" "G-REDscript-Profiler-v1.0.0.zip" >> release-body.md

          gh release create v1.0.0             release-assets/G-REDscript-Profiler-v1.0.0.zip             release-assets/G-REDscript-Profiler-v1.0.0.zip.sha256.txt             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "GRSP_G-REDscript_Profiler_v1.0.0"             --notes-file release-body.md             --latest
