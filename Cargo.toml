[package]
name = "g-redscript-profiler"
version = "1.0.0"
edition = "2024"

[lib]
name = "g_redscript_profiler"
crate-type = ["cdylib"]

# Standalone GRSP remains unchanged. The GCO native bundle explicitly enables
# strict F11-stop-only capture completion through this source-owned feature.
[features]
default = []
gco_explicit_f11 = []

[dependencies]
parking_lot = "0.12"
static_assertions = "1"
red4ext-rs = { git = "https://github.com/jac3km4/red4ext-rs", rev = "c44146c" }

[profile.release]
codegen-units = 1
panic = "abort"
lto = true
strip = true
